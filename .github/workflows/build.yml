name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour créer la Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Version automatique : 0.1.<numéro de compilation>, ex. 0.1.7
      - name: Calcul de la version
        id: version
        shell: bash
        run: echo "version=0.7.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restauration des paquets
        run: dotnet restore VideoFly.sln

      - name: Compilation
        run: dotnet build VideoFly.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Publication (exécutable autonome Windows x64)
        run: dotnet publish src/VideoFly/VideoFly.csproj -c Release -r win-x64 --self-contained true -o publish -p:Version=${{ steps.version.outputs.version }}

      - name: Archive zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath VideoFly-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Mise à disposition de l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: VideoFly-win-x64
          path: publish/
          retention-days: 30

      # Après chaque merge / push sur main : une Release GitHub avec le zip attaché.
      - name: Création de la Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "VideoFly-${{ steps.version.outputs.version }}-win-x64.zip" \
            --target "${{ github.sha }}" \
            --title "VideoFly ${{ steps.version.outputs.version }}" \
            --generate-notes
